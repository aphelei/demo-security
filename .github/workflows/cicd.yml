name: Exemple cicd
on:
    push:
        branches: [main]

jobs:
    Bandit-Scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                 python-version: '3.14'
            - name: Install Bandit
              run: pip install bandit
            - name: Run Bandit
              run: bandit -r . -x .venv
    Zap-Scan:
        runs-on: ubuntu-latest
    Deploy:
        runs-on: ubuntu-latest
        needs: [Bandit-Scan, Zap-Scan]

            