name: Exemple cicd
on:
    push:
        branches: [main]

jobs:
    Bandit-Scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                 python-version: '3.14'
            - name: Install Bandit
              run: pip install bandit
            - name: Run Bandit
              run: bandit -r . -x .venv
    Zap-Scan:
        runs-on: ubuntu-latest
        services:
            db:
                image: postgres
                ports:
                    - 5432:5432
                env:
                    POSTGRES_PASSWORD: test1234
        steps: 
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                 python-version: '3.14'
            - name: Install Dependencies
              run: pip install -r requirements.txt
            - name: Deploy database
              run: alembic upgrade head
            - name: Run Api
              run: python main.py
              env:
                DB_URL: postgresql://postgres:test1234@localhost:5432/postgres
                JWT_SECRET: azertyuiopazertyuiopazertyuiop
                APPLICATION_PEPPER: ${{secrets.APPLICATION_PEPPER}}
                TEST_TOKEN: '1234'
            - name: Wait for FastAPI to be Ready
              run: |
                echo "Attente du démarrage de FastAPI..."
                timeout 30s bash -c '
                until curl -s http://localhost:8000 > /dev/null; do
                    sleep 1
                done'
                echo "FastAPI est opérationnel !"
            - name: Run ZAP
              uses: zaproxy/action-api-scan@v0.10.0
              with:
                target: http://localhost:8000/openapi.json
              env:
                ZAP_AUTH_HEADER_VALUE : 'Bearer 1234'
                ZAP_AUTH_HEADER: Authorization
    Deploy:
        runs-on: ubuntu-latest
        needs: [Bandit-Scan, Zap-Scan]
        steps:
            - run: echo 42

            